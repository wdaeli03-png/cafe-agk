<header><h1>☕ Cafe AGK</h1><div id="headerUser" class="muted"></div></header>

<section id="loginBox" class="login">
<h2>Login Cafe AGK</h2><p class="muted">Masuk menggunakan akun pemilik atau karyawan.</p>
<label>Email</label><input id="email" type="email" placeholder="email akun">
<label>Password</label><input id="password" type="password" placeholder="password">
<button style="width:100%" onclick="login()">Masuk</button><p id="loginMsg" class="muted"></p><p class="small muted">Data tersimpan di Supabase dan disinkronkan otomatis saat koneksi tersedia.</p>
</section>
<section id="app" class="hidden app-layout">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kzwxhvpbdvprxubrfsnb.supabase.co';
const SUPABASE_KEY='sb_publishable_u7Y5UqxHOZSBDbgfstb5yQ_n5jPNN1R';
const sb= supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,page='dashboard',products=[],categories=[],tx=[],stocks=[],announcements=[],orderCart=[],autoRefreshTimer=null,realtimeChannel=null;
const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,s){let el=document.getElementById(id);if(el)el.textContent=s}
async function login(){msg('loginMsg','Memeriksa akun...');let {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg('loginMsg',error.message);return}user=data.user;let p=await sb.from('agk_profiles').select('*').eq('id',user.id).maybeSingle();if(p.error||!p.data){await sb.auth.signOut();msg('loginMsg',p.error?'Gagal membaca profil: '+p.error.message:'Profil tidak ditemukan. Jalankan SQL setup Supabase.');return}profile=p.data;initApp()}
async function initApp(){
 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 document.getElementById('headerUser').innerHTML=esc(profile.full_name||user.email)+' • '+esc(profile.role||'pengguna')+' <button class="secondary" onclick="logout()">Keluar</button>';
 await refresh(); renderNav(); show('dashboard'); startAutoUpdates();
}
async function logout(){
 if(autoRefreshTimer)clearInterval(autoRefreshTimer);
 if(realtimeChannel)await sb.removeChannel(realtimeChannel);
 await sb.auth.signOut(); location.reload();
}
async function refresh(){
 const [p,c,t,s,a]=await Promise.all([
  sb.from('agk_products').select('*').order('name'),
  sb.from('agk_categories').select('*').order('name'),
  sb.from('agk_transactions').select('*').order('created_at',{ascending:false}),
  sb.from('agk_inventory').select('*').order('created_at',{ascending:false}),
  sb.from('agk_announcements').select('*').order('created_at',{ascending:false})
 ]);
 const errors=[p.error,c.error,t.error,s.error,a.error].filter(Boolean);
 products=p.data||[]; categories=c.data||[]; tx=t.data||[]; stocks=s.data||[]; announcements=a.data||[];
 if(errors.length) console.warn('Sebagian data Cafe AGK gagal dimuat:',errors);
}
function startAutoUpdates(){
 if(autoRefreshTimer)clearInterval(autoRefreshTimer);
 autoRefreshTimer=setInterval(async()=>{
  await refresh();
  if(isEditingForm())return;
  if(page==='dashboard')dashboard(document.getElementById('content'));
  else if(page==='transaksi')transactions(document.getElementById('content'));
  else if(page==='stok')inventory(document.getElementById('content'));
  else if(page==='menu')menus(document.getElementById('content'));
  else if(page==='laporan'&&isOwner())reports(document.getElementById('content'));
  else if(page==='informasi'&&isOwner())announcementManager(document.getElementById('content'));
 },30000);
 if(realtimeChannel)sb.removeChannel(realtimeChannel);
 realtimeChannel=sb.channel('agk-live-updates')
  .on('postgres_changes',{event:'*',schema:'public',table:'agk_products'},()=>refreshAndRender())
  .on('postgres_changes',{event:'*',schema:'public',table:'agk_categories'},()=>refreshAndRender())
  .on('postgres_changes',{event:'*',schema:'public',table:'agk_transactions'},()=>refreshAndRender())
  .on('postgres_changes',{event:'*',schema:'public',table:'agk_inventory'},()=>refreshAndRender())
  .on('postgres_changes',{event:'*',schema:'public',table:'agk_announcements'},()=>refreshAndRender())
  .subscribe();
}
function isEditingForm(){const el=document.activeElement;return !!el&&(['INPUT','TEXTAREA','SELECT'].includes(el.tagName));}
async function refreshAndRender(){
 await refresh();
 if(isEditingForm())return;
 const c=document.getElementById('content'); if(!c)return;
 if(page==='dashboard')dashboard(c);
 else if(page==='transaksi')transactions(c);
 else if(page==='stok')inventory(c);
 else if(page==='menu')menus(c);
 else if(page==='laporan'&&isOwner())reports(c);
 else if(page==='informasi'&&isOwner())announcementManager(c);
}
function isOwner(){
 const role=String(profile?.role||'').trim().toLowerCase();
 return ['owner','pemilik'].includes(role);
}
function renderNav(){
 const items=isOwner()
  ? ['dashboard','transaksi','stok','menu','laporan','informasi']
  : ['dashboard','transaksi','stok','menu'];
 document.getElementById('nav').innerHTML=items.map(x=>`<button class="${page===x?'active':''}" onclick="show('${x}')">${({dashboard:'Beranda',transaksi:'Pesanan',stok:'Stok',menu:'Kelola Menu',laporan:'Laporan',informasi:'Informasi'})[x]}</button>`).join('');
}
async function show(p){
 const allowed=['dashboard','transaksi','stok','menu'];
 if(isOwner())allowed.push('laporan','informasi');
 if(!allowed.includes(p)){alert('Menu ini hanya dapat diakses oleh pemilik Cafe AGK.');page='dashboard';}
 else page=p;
 renderNav();await refresh();let c=document.getElementById('content');
 if(page==='dashboard')dashboard(c);
 if(page==='transaksi')transactions(c);
 if(page==='stok')inventory(c);
 if(page==='menu')menus(c);
 if(page==='laporan'&&isOwner())reports(c);
 if(page==='informasi'&&isOwner())announcementManager(c);
}

function transactions(c){c.innerHTML=`<div class="card"><h2>Pesanan Karyawan</h2><p class="muted">Pilih kategori dan menu, lalu masukkan jumlah pesanan.</p><div class="actions"><button onclick="orderCategory('Makanan')">🍛 Makanan</button><button onclick="orderCategory('Minuman')">☕ Minuman</button><button onclick="orderCategory('Snack')">🍟 Snack</button></div><div id="orderItems" class="grid" style="margin-top:14px"></div><div class="card"><h3>Keranjang Pesanan</h3><div id="cartItems"></div><div class="stat" id="cartTotal">Rp 0</div><button onclick="saveOrder()">Simpan Pesanan</button><button class="secondary" onclick="clearCart()">Kosongkan</button><p id="orderMsg" class="muted"></p></div></div><div class="card"><h2>Transaksi Manual (opsional)</h2><div class="row"><div><label>Jenis</label><select id="tt"><option value="sale">Penjualan</option><option value="expense">Pengeluaran</option></select></div><div><label>Jumlah (Rp)</label><input id="amount" type="number" min="0" placeholder="Jumlah rupiah"></div></div><label>Keterangan</label><input id="desc" placeholder="Contoh: beli bahan"><button onclick="saveTx()">Simpan Transaksi</button><p id="txMsg" class="muted"></p></div><div class="card"><h3>Transaksi terbaru</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th></tr></thead><tbody>${tx.slice(0,80).map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('id-ID'))}</td><td>${esc(x.transaction_type)}</td><td>${money(x.amount)}</td><td>${esc(x.description||'')}</td></tr>`).join('')}</tbody></table></div></div>`;orderCategory('Makanan');renderCart()}
function orderCategory(cat){let target=document.getElementById('orderItems');if(!target)return;let list=products.filter(p=>p.is_active!==false&&categories.some(k=>String(k.id)===String(p.category_id)&&k.name.toLowerCase()===cat.toLowerCase()));target.innerHTML=list.length?list.map(p=>`<div class="card"><strong>${esc(p.name)}</strong><p class="muted">${money(p.price)}</p><button onclick="addToCart(${p.id})">Tambah</button></div>`).join(''):`<div class="notice">Menu ${esc(cat)} belum tersedia.</div>`}
function addToCart(id){let p=products.find(x=>String(x.id)===String(id));if(!p)return;let item=orderCart.find(x=>String(x.id)===String(id));if(item)item.qty++;else orderCart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});renderCart()}
function renderCart(){let el=document.getElementById('cartItems');if(!el)return;el.innerHTML=orderCart.length?orderCart.map((x,i)=>`<div class="inline"><div>${esc(x.name)} × ${x.qty}</div><div>${money(x.price*x.qty)}</div><button class="secondary" onclick="changeQty(${i},-1)">−</button><button onclick="changeQty(${i},1)">+</button></div>`).join(''):'Keranjang masih kosong';document.getElementById('cartTotal').textContent=money(orderCart.reduce((a,x)=>a+x.price*x.qty,0))}
function changeQty(i,n){if(!orderCart[i])return;orderCart[i].qty+=n;if(orderCart[i].qty<=0)orderCart.splice(i,1);renderCart()}
function clearCart(){orderCart=[];renderCart();msg('orderMsg','Keranjang dikosongkan.')}
async function saveOrder(){if(!orderCart.length)return msg('orderMsg','Pilih menu terlebih dahulu.');let total=orderCart.reduce((a,x)=>a+x.price*x.qty,0);let description='Pesanan: '+orderCart.map(x=>x.name+' x'+x.qty).join(', ');let {error}=await sb.from('agk_transactions').insert({transaction_type:'sale',amount:total,description,created_by:user.id});msg('orderMsg',error?error.message:'Pesanan berhasil disimpan.');if(!error){orderCart=[];show('transaksi')}}

async function saveTx(){let amount=Number(document.getElementById('amount').value),type=document.getElementById('tt').value,description=document.getElementById('desc').value;if(!amount||amount<0){msg('txMsg','Masukkan jumlah yang benar.');return}let {error}=await sb.from('agk_transactions').insert({transaction_type:type,amount,description,created_by:user.id});msg('txMsg',error?error.message:'Transaksi berhasil disimpan.');if(!error)show('transaksi')}
function inventory(c){
 c.innerHTML=`<div class="card"><h2>Catat Stok</h2><div class="row">
 <div><label>Nama Barang</label><input id="sn" placeholder="Contoh: Kopi"></div>
 <div><label>Stok Awal</label><input id="so" type="number" min="0" value="0" oninput="stockPreview()"></div>
 <div><label>Stok Keluar</label><input id="su" type="number" min="0" value="0" oninput="stockPreview()"></div>
 <div><label>Stok Akhir (Otomatis)</label><input id="se" type="number" value="0" readonly></div>
 </div><p class="small muted">Stok akhir dihitung otomatis: Stok Awal − Stok Keluar.</p>
 <button onclick="saveStock()">Simpan Stok</button><p id="stockMsg" class="muted"></p></div>
 <div class="card"><h3>Catatan Stok</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Nama Barang</th><th>Stok Awal</th><th>Stok Keluar</th><th>Stok Akhir</th><th>Petugas</th></tr></thead><tbody>${stocks.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('id-ID'))}</td><td>${esc(x.product_name)}</td><td>${esc(x.opening)}</td><td>${esc(x.outgoing)}</td><td>${esc(x.ending)}</td><td>${esc(x.created_by||'')}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada catatan stok.</td></tr>'}</tbody></table></div></div>`;
 stockPreview();
}
function stockPreview(){
 const opening=Number(document.getElementById('so')?.value||0);
 const outgoing=Number(document.getElementById('su')?.value||0);
 const ending=Math.max(0,opening-outgoing);
 const field=document.getElementById('se');
 if(field)field.value=ending;
}
async function saveStock(){
 let opening=Number(document.getElementById('so').value||0);
 let outgoing=Number(document.getElementById('su').value||0);
 let product_name=document.getElementById('sn').value.trim();
 if(!product_name){msg('stockMsg','Nama barang harus diisi.');return}
 if(opening<0||outgoing<0||!Number.isFinite(opening)||!Number.isFinite(outgoing)){msg('stockMsg','Jumlah stok tidak boleh negatif.');return}
 let ending=opening-outgoing;
 if(ending<0){msg('stockMsg','Stok keluar tidak boleh melebihi stok awal.');return}
 let {error}=await sb.from('agk_inventory').insert({product_name,opening,incoming:0,outgoing,ending,created_by:user.id});
 msg('stockMsg',error?error.message:'Catatan stok berhasil disimpan.');
 if(!error)show('stok');
}
function menus(c){
 c.innerHTML=`<div class="card"><h2>Tambah Kategori</h2><div class="row"><div><label>Nama kategori</label><input id="catName" placeholder="Makanan / Minuman / Lainnya"></div><div style="align-self:end"><button onclick="addCat()">Simpan kategori</button></div></div><p id="catMsg" class="muted"></p></div>
 <div class="notice">Akses karyawan dan pemilik: dapat menambah, mengedit, mengaktifkan/nonaktifkan, dan menghapus menu. Simpanan tetap mengikuti izin database Supabase.</div><div class="card"><h2>Tambah Menu</h2><div class="row"><div><label>Nama menu</label><input id="pn" placeholder="Nama makanan/minuman"></div><div><label>Kategori</label><select id="pc"><option value="">Tanpa kategori</option>${categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Harga (Rp)</label><input id="pp" type="number" min="0"></div></div><label>Deskripsi</label><input id="pd" placeholder="Opsional"><button onclick="addProduct()">Simpan Menu</button><p id="pMsg" class="muted"></p></div>
 <div class="card"><h2>Daftar Menu</h2><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${products.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(categories.find(k=>String(k.id)===String(x.category_id))?.name||'-')}</td><td>${money(x.price)}</td><td>${x.is_active===false?'Nonaktif':'Aktif'}</td><td class="actions"><button class="secondary" onclick="editProduct(${x.id})">Edit</button><button class="secondary" onclick="toggleProduct(${x.id})">${x.is_active===false?'Aktifkan':'Nonaktifkan'}</button><button class="danger" onclick="delProduct(${x.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada menu.</td></tr>'}</tbody></table></div></div>`;
}
async function addCat(){let name=document.getElementById('catName').value.trim();if(!name)return msg('catMsg','Isi nama kategori.');let {error}=await sb.from('agk_categories').insert({name});msg('catMsg',error?error.message:'Kategori disimpan.');if(!error)show('menu')}
async function addProduct(){let name=document.getElementById('pn').value.trim(),category_id=document.getElementById('pc').value||null,rawPrice=document.getElementById('pp').value,price=Number(rawPrice),description=document.getElementById('pd').value.trim();if(!name||rawPrice===''||!Number.isFinite(price)||price<0)return msg('pMsg','Isi nama menu dan harga yang benar.');let {error}=await sb.from('agk_products').insert({name,category_id,price,description,is_active:true});msg('pMsg',error?error.message:'Menu berhasil disimpan.');if(!error)show('menu')}
async function editProduct(id){
 let x=products.find(p=>String(p.id)===String(id)); if(!x)return;
 let name=prompt('Nama menu:',x.name); if(name===null)return; name=name.trim();
 if(!name){alert('Nama menu wajib diisi.');return}
 let priceText=prompt('Harga (Rp):',x.price); if(priceText===null)return;
 let price=Number(priceText); if(!Number.isFinite(price)||price<0){alert('Harga harus berupa angka nol atau lebih.');return}
 let description=prompt('Deskripsi:',x.description||''); if(description===null)return;
 let cat=prompt('ID kategori (kosong jika tanpa kategori):',x.category_id||''); if(cat===null)return;
 let {error}=await sb.from('agk_products').update({name,price,description,category_id:cat.trim()||null}).eq('id',id);
 alert(error?'Gagal mengedit menu: '+error.message:'Menu berhasil diperbarui.');
 if(!error)show('menu');
}
async function toggleProduct(id){let x=products.find(p=>String(p.id)===String(id));if(!x)return;let {error}=await sb.from('agk_products').update({is_active:x.is_active===false}).eq('id',id);alert(error?error.message:'Status menu diperbarui.');if(!error)show('menu')}
async function delProduct(id){if(!confirm('Hapus menu ini?'))return;let {error}=await sb.from('agk_products').delete().eq('id',id);alert(error?error.message:'Menu dihapus.');if(!error)show('menu')}
function reports(c){c.innerHTML=`<div class="card"><h2>Laporan Cafe AGK</h2><div class="reportbuttons"><button onclick="reportPreset('day')">Harian</button><button onclick="reportPreset('week')">Mingguan</button><button onclick="reportPreset('month')">Bulanan</button></div><div class="row"><div><label>Dari tanggal</label><input type="date" id="from"></div><div><label>Sampai tanggal</label><input type="date" id="to"></div></div><button onclick="filterReport()">Tampilkan</button> <button class="secondary" onclick="reportPreset('day')">Hari ini</button><div id="reportOut"></div></div>`;reportPreset('day')}
function dateLocal(d){let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function reportPreset(kind){let now=new Date(),start=new Date(now),end=new Date(now);if(kind==='week'){let dow=(now.getDay()+6)%7;start.setDate(now.getDate()-dow);end.setDate(start.getDate()+6)}else if(kind==='month'){start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0)}document.getElementById('from').value=dateLocal(start);document.getElementById('to').value=dateLocal(end);filterReport()}
function filterReport(){let from=document.getElementById('from')?.value,to=document.getElementById('to')?.value;if(!document.getElementById('reportOut'))return;let filtered=tx.filter(x=>{let d=dateLocal(new Date(x.created_at));return(!from||d>=from)&&(!to||d<=to)});let sale=filtered.filter(x=>['sale','penjualan'].includes(x.transaction_type)).reduce((a,x)=>a+Number(x.amount||0),0),exp=filtered.filter(x=>['expense','pengeluaran'].includes(x.transaction_type)).reduce((a,x)=>a+Number(x.amount||0),0);let net=sale-exp;let label=(from||'Semua tanggal')+' sampai '+(to||'');let rows=filtered.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('id-ID'))}</td><td>${esc(x.transaction_type)}</td><td>${money(x.amount)}</td><td>${esc(x.description||'')}</td></tr>`).join('');document.getElementById('reportOut').innerHTML=`<div id="reportPrintable"><h3>Periode: ${esc(label)}</h3><div class="grid"><div class="card"><div class="muted">Penjualan</div><div class="stat">${money(sale)}</div></div><div class="card"><div class="muted">Pengeluaran</div><div class="stat">${money(exp)}</div></div><div class="card"><div class="muted">Selisih</div><div class="stat">${money(net)}</div></div></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Tidak ada transaksi pada periode ini.</td></tr>'}</tbody></table></div></div><button onclick="downloadReportPDF()">Download PDF</button>`}
function downloadReportPDF(){let source=document.getElementById('reportPrintable');if(!source)return;let win=window.open('','_blank');if(!win){alert('Izinkan pop-up browser untuk mencetak PDF.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Laporan Cafe AGK</title><style>body{font-family:Arial,sans-serif;color:#111;margin:24px}h2,h3{margin:8px 0}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #aaa;padding:8px;text-align:left}th{background:#eee}.grid{display:flex;gap:15px}.card{border:1px solid #aaa;padding:12px;flex:1}.stat{font-weight:bold;font-size:18px;margin-top:8px}.muted{color:#444}@media print{body{margin:10mm}}
/* AGK GOLD BACKGROUND UPDATE */
body{background:radial-gradient(ellipse at 12% 8%,#fff2c8 0%,transparent 38%),radial-gradient(ellipse at 88% 92%,#d7aa51 0%,transparent 36%),linear-gradient(135deg,#c89a38,#f2d88b 45%,#b88324)!important;background-attachment:fixed!important;color:#26342d!important}
.wrap{background:transparent!important}
.card,.login{background:linear-gradient(145deg,#fffdf7,#fff7e4)!important;border:1px solid #dfbd71!important;box-shadow:0 10px 26px rgba(105,72,18,.16),inset 0 1px 0 #fff!important}

</style></head><body><h2>Cafe AGK</h2><h3>Laporan Transaksi</h3>${source.innerHTML}<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`);win.document.close()}
async function announcementManager(c){c.innerHTML=`<div class="card"><h2>Informasi Cafe AGK</h2><p class="muted">Semua akun yang masuk dapat menerbitkan dan mengelola informasi.</p><textarea id="announcementText" rows="4" placeholder="Isi pengumuman atau informasi..."></textarea><button onclick="publishAnnouncement()">Terbitkan</button><p id="announcementMsg"></p></div><div class="card"><h3>Daftar Informasi</h3>${announcements.map(x=>`<div class="card"><p>${esc(x.message)}</p><div class="small muted">${esc(new Date(x.created_at).toLocaleString('id-ID'))} • ${x.is_active===false?'Nonaktif':'Aktif'}</div>${x.is_active===false?'':`<button class="danger" onclick="deactivateAnnouncement(${x.id})">Nonaktifkan</button>`}</div>`).join('')||'Belum ada informasi.'}</div>`}
async function publishAnnouncement(){let field=document.getElementById('announcementText')||document.getElementById('quickAnnouncement');let message=field?.value.trim();if(!message){msg('announcementMsg','Isi informasi terlebih dahulu.');return}let {error}=await sb.from('agk_announcements').insert({message,created_by:user.id,is_active:true});msg('announcementMsg',error?error.message:'Informasi berhasil diterbitkan.');if(!error)show('informasi')}
async function deactivateAnnouncement(id){if(!confirm('Nonaktifkan informasi ini?'))return;let {error}=await sb.from('agk_announcements').update({is_active:false}).eq('id',id);if(error)alert(error.message);else show('informasi')}

sb.auth.getSession().then(async ({data,error})=>{if(error){msg('loginMsg','Gagal memeriksa sesi: '+error.message);return}if(data.session){user=data.session.user;let {data:p,error:profileError}=await sb.from('agk_profiles').select('*').eq('id',user.id).maybeSingle();if(p){profile=p;initApp()}else{await sb.auth.signOut();msg('loginMsg',profileError?'Gagal membaca profil: '+profileError.message:'Profil akun belum tersedia. Jalankan SQL setup Supabase terlebih dahulu.')}}})
</script>
