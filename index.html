<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafe AGK</title>
<style>
:root{--bg:#071b18;--panel:#102a25;--panel2:#163630;--green:#10b981;--gold:#f5c56b;--text:#ecfdf5;--muted:#9bb8ad;--danger:#fb7185}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#061512,#0c2923 55%,#09201b);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;background:var(--green);color:#06251c;font-weight:700;padding:11px 15px;cursor:pointer}button.secondary{background:#294b43;color:var(--text)}button.danger{background:var(--danger);color:#350b12}input,select,textarea{width:100%;border:1px solid #34564d;background:#071e19;color:var(--text);border-radius:10px;padding:11px;margin:5px 0 12px}label{color:var(--muted);font-size:13px}header{padding:18px 22px;border-bottom:1px solid #24463d;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{margin:0;font-size:23px;color:var(--gold)}.wrap{max-width:1200px;margin:auto;padding:18px}.login{max-width:420px;margin:8vh auto;background:var(--panel);padding:26px;border-radius:18px;border:1px solid #31554b}.login h2{color:var(--gold)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.nav button{background:#20443a;color:var(--text)}.nav button.active{background:var(--green);color:#05251c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:linear-gradient(160deg,var(--panel),var(--panel2));padding:18px;border:1px solid #2b5045;border-radius:16px;margin-bottom:14px}.stat{font-size:26px;color:var(--gold);font-weight:800;margin-top:6px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid #294a40}th{color:var(--gold)}.tablewrap{overflow:auto}.muted{color:var(--muted)}.notice{background:#263e31;border-radius:10px;padding:12px;color:#d7f6e6}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px}.foot{color:var(--muted);padding:20px;text-align:center}h2,h3{margin-top:0}.inline{display:flex;align-items:center;gap:10px}.inline>*{flex:1}@media(max-width:600px){header{padding:14px}.wrap{padding:12px}.stat{font-size:22px}.nav button{flex:1}}
</style>
</head>
<body>
<header><h1>☕ Cafe AGK</h1><div id="headerUser" class="muted"></div></header>
<div class="wrap">
<section id="loginBox" class="login">
<h2>Login Cafe AGK</h2><p class="muted">Masuk menggunakan akun pemilik atau karyawan.</p>
<label>Email</label><input id="email" type="email" placeholder="email akun">
<label>Password</label><input id="password" type="password" placeholder="password">
<button style="width:100%" onclick="login()">Masuk</button><p id="loginMsg" class="muted"></p>
</section>
<section id="app" class="hidden">
<div class="nav" id="nav"></div><div id="content"></div>
</section>
</div><div class="foot">Cafe AGK • Sistem Operasional Cafe</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kzwxhvpbdvprxubrfsnb.supabase.co';
const SUPABASE_KEY='sb_publishable_u7Y5UqxHOZSBDbgfstb5yQ_n5jPNN1R';
const sb= supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,page='dashboard',products=[],categories=[],tx=[],stocks=[];
const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,s){let el=document.getElementById(id);if(el)el.textContent=s}
async function login(){msg('loginMsg','Memeriksa akun...');let {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg('loginMsg',error.message);return}user=data.user;let p=await sb.from('agk_profiles').select('*').eq('id',user.id).maybeSingle();if(p.error||!p.data){await sb.auth.signOut();msg('loginMsg','Profil tidak ditemukan. Periksa agk_profiles.');return}profile=p.data;initApp()}
async function initApp(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('headerUser').innerHTML=esc(profile.full_name||user.email)+' • '+esc(profile.role)+' <button class="secondary" onclick="logout()">Keluar</button>';await refresh();renderNav();show('dashboard')}
async function logout(){await sb.auth.signOut();location.reload()}
async function refresh(){let [p,c,t,s]=await Promise.all([sb.from('agk_products').select('*').order('name'),sb.from('agk_categories').select('*').order('name'),sb.from('agk_transactions').select('*').order('created_at',{ascending:false}),sb.from('agk_inventory').select('*').order('created_at',{ascending:false})]);products=p.data||[];categories=c.data||[];tx=t.data||[];stocks=s.data||[]}
function renderNav(){let items=['dashboard','transaksi','stok','menu'];if(profile.role==='owner')items.push('laporan');document.getElementById('nav').innerHTML=items.map(x=>`<button class="${page===x?'active':''}" onclick="show('${x}')">${({dashboard:'Dashboard',transaksi:'Transaksi',stok:'Stok',menu:'Kelola Menu',laporan:'Laporan'})[x]}</button>`).join('')}
async function show(p){page=p;renderNav();await refresh();let c=document.getElementById('content');if(p==='dashboard')dashboard(c);if(p==='transaksi')transactions(c);if(p==='stok')inventory(c);if(p==='menu')menus(c);if(p==='laporan')reports(c)}
function dashboard(c){let sales=tx.filter(x=>x.transaction_type==='sale'||x.transaction_type==='penjualan').reduce((a,x)=>a+Number(x.amount||0),0),expense=tx.filter(x=>x.transaction_type==='expense'||x.transaction_type==='pengeluaran').reduce((a,x)=>a+Number(x.amount||0),0);c.innerHTML=`<div class="grid"><div class="card"><div class="muted">Penjualan tercatat</div><div class="stat">${money(sales)}</div></div><div class="card"><div class="muted">Pengeluaran tercatat</div><div class="stat">${money(expense)}</div></div><div class="card"><div class="muted">Selisih</div><div class="stat">${money(sales-expense)}</div></div><div class="card"><div class="muted">Jumlah menu</div><div class="stat">${products.length}</div></div></div><div class="card"><h3>Selamat datang di Cafe AGK</h3><p class="muted">Gunakan menu Transaksi untuk mencatat penjualan/pengeluaran, menu Stok untuk catatan stok, dan Kelola Menu untuk mengelola produk.</p></div>`}
let orderCart=[];
function transactions(c){c.innerHTML=`<div class="card"><h2>Pesanan Karyawan</h2><p class="muted">Pilih kategori dan menu, lalu masukkan jumlah pesanan.</p><div class="actions"><button onclick="orderCategory('Makanan')">🍛 Makanan</button><button onclick="orderCategory('Minuman')">☕ Minuman</button><button onclick="orderCategory('Snack')">🍟 Snack</button></div><div id="orderItems" class="grid" style="margin-top:14px"></div><div class="card"><h3>Keranjang Pesanan</h3><div id="cartItems"></div><div class="stat" id="cartTotal">Rp 0</div><button onclick="saveOrder()">Simpan Pesanan</button><button class="secondary" onclick="clearCart()">Kosongkan</button><p id="orderMsg" class="muted"></p></div></div><div class="card"><h2>Transaksi Manual (opsional)</h2><div class="row"><div><label>Jenis</label><select id="tt"><option value="sale">Penjualan</option><option value="expense">Pengeluaran</option></select></div><div><label>Jumlah (Rp)</label><input id="amount" type="number" min="0" placeholder="Jumlah rupiah"></div></div><label>Keterangan</label><input id="desc" placeholder="Contoh: beli bahan"><button onclick="saveTx()">Simpan Transaksi</button><p id="txMsg" class="muted"></p></div><div class="card"><h3>Transaksi terbaru</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th></tr></thead><tbody>${tx.slice(0,80).map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('id-ID'))}</td><td>${esc(x.transaction_type)}</td><td>${money(x.amount)}</td><td>${esc(x.description||'')}</td></tr>`).join('')}</tbody></table></div></div>`;orderCategory('Makanan');renderCart()}
function orderCategory(cat){let target=document.getElementById('orderItems');if(!target)return;let list=products.filter(p=>p.is_active!==false&&categories.some(k=>String(k.id)===String(p.category_id)&&k.name.toLowerCase()===cat.toLowerCase()));target.innerHTML=list.length?list.map(p=>`<div class="card"><strong>${esc(p.name)}</strong><p class="muted">${money(p.price)}</p><button onclick="addToCart(${p.id})">Tambah</button></div>`).join(''):`<div class="notice">Menu ${esc(cat)} belum tersedia.</div>`}
function addToCart(id){let p=products.find(x=>String(x.id)===String(id));if(!p)return;let item=orderCart.find(x=>String(x.id)===String(id));if(item)item.qty++;else orderCart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});renderCart()}
function renderCart(){let el=document.getElementById('cartItems');if(!el)return;el.innerHTML=orderCart.length?orderCart.map((x,i)=>`<div class="inline"><div>${esc(x.name)} × ${x.qty}</div><div>${money(x.price*x.qty)}</div><button class="secondary" onclick="changeQty(${i},-1)">−</button><button onclick="changeQty(${i},1)">+</button></div>`).join(''):'Keranjang masih kosong';document.getElementById('cartTotal').textContent=money(orderCart.reduce((a,x)=>a+x.price*x.qty,0))}
function changeQty(i,n){if(!orderCart[i])return;orderCart[i].qty+=n;if(orderCart[i].qty<=0)orderCart.splice(i,1);renderCart()}
function clearCart(){orderCart=[];renderCart();msg('orderMsg','Keranjang dikosongkan.')}
async function saveOrder(){if(!orderCart.length)return msg('orderMsg','Pilih menu terlebih dahulu.');let total=orderCart.reduce((a,x)=>a+x.price*x.qty,0);let description='Pesanan: '+orderCart.map(x=>x.name+' x'+x.qty).join(', ');let {error}=await sb.from('agk_transactions').insert({transaction_type:'sale',amount:total,description,created_by:user.id});msg('orderMsg',error?error.message:'Pesanan berhasil disimpan.');if(!error){orderCart=[];show('transaksi')}}

async function saveTx(){let amount=Number(document.getElementById('amount').value),type=document.getElementById('tt').value,description=document.getElementById('desc').value;if(!amount||amount<0){msg('txMsg','Masukkan jumlah yang benar.');return}let {error}=await sb.from('agk_transactions').insert({transaction_type:type,amount,description,created_by:user.id});msg('txMsg',error?error.message:'Transaksi berhasil disimpan.');if(!error)show('transaksi')}
function inventory(c){c.innerHTML=`<div class="card"><h2>Catat Stok</h2><div class="row"><div><label>Nama barang</label><input id="sn" placeholder="Contoh: Kopi"></div><div><label>Stok awal</label><input id="so" type="number" value="0"></div><div><label>Stok masuk</label><input id="si" type="number" value="0"></div><div><label>Stok keluar</label><input id="su" type="number" value="0"></div></div><button onclick="saveStock()">Simpan Stok</button><p id="stockMsg" class="muted"></p></div><div class="card"><h3>Catatan Stok</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Awal</th><th>Masuk</th><th>Keluar</th><th>Akhir</th><th>Petugas</th></tr></thead><tbody>${stocks.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('id-ID'))}</td><td>${esc(x.product_name)}</td><td>${esc(x.opening)}</td><td>${esc(x.incoming)}</td><td>${esc(x.outgoing)}</td><td>${esc(x.ending)}</td><td>${esc(x.created_by||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function saveStock(){let opening=Number(document.getElementById('so').value||0),incoming=Number(document.getElementById('si').value||0),outgoing=Number(document.getElementById('su').value||0),product_name=document.getElementById('sn').value.trim();if(!product_name){msg('stockMsg','Nama barang harus diisi.');return}let ending=opening+incoming-outgoing;if(ending<0){msg('stockMsg','Stok akhir tidak boleh minus.');return}let {error}=await sb.from('agk_inventory').insert({product_name,opening,incoming,outgoing,ending,created_by:user.id});msg('stockMsg',error?error.message:'Catatan stok berhasil disimpan.');if(!error)show('stok')}
function menus(c){let owner=profile.role==='owner';c.innerHTML=`${owner?`<div class="card"><h2>Tambah Kategori</h2><div class="row"><div><label>Nama kategori</label><input id="catName" placeholder="Makanan / Minuman / Lainnya"></div><div style="align-self:end"><button onclick="addCat()">Simpan kategori</button></div></div><p id="catMsg" class="muted"></p></div><div class="card"><h2>Tambah Menu</h2><div class="row"><div><label>Nama menu</label><input id="pn" placeholder="Nama makanan/minuman"></div><div><label>Kategori</label><select id="pc"><option value="">Tanpa kategori</option>${categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Harga (Rp)</label><input id="pp" type="number" min="0"></div></div><label>Deskripsi</label><input id="pd" placeholder="Opsional"><button onclick="addProduct()">Simpan Menu</button><p id="pMsg" class="muted"></p></div>`:''}<div class="card"><h2>Daftar Menu</h2><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Status</th>${owner?'<th>Aksi</th>':''}</tr></thead><tbody>${products.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(categories.find(k=>String(k.id)===String(x.category_id))?.name||'-')}</td><td>${money(x.price)}</td><td>${x.is_active===false?'Nonaktif':'Aktif'}</td>${owner?`<td class="actions"><button class="secondary" onclick="editProduct(${x.id})">Edit</button><button class="danger" onclick="delProduct(${x.id})">Hapus</button></td>`:''}</tr>`).join('')}</tbody></table></div></div>`}
async function addCat(){let name=document.getElementById('catName').value.trim();if(!name)return msg('catMsg','Isi nama kategori.');let {error}=await sb.from('agk_categories').insert({name});msg('catMsg',error?error.message:'Kategori disimpan.');if(!error)show('menu')}
async function addProduct(){let name=document.getElementById('pn').value.trim(),category_id=document.getElementById('pc').value||null,price=Number(document.getElementById('pp').value),description=document.getElementById('pd').value;if(!name||price<0)return msg('pMsg','Isi nama menu dan harga yang benar.');let {error}=await sb.from('agk_products').insert({name,category_id,price,description,is_active:true});msg('pMsg',error?error.message:'Menu berhasil disimpan.');if(!error)show('menu')}
async function editProduct(id){let x=products.find(p=>String(p.id)===String(id));if(!x)return;let name=prompt('Nama menu:',x.name);if(name===null)return;let price=prompt('Harga:',x.price);if(price===null)return;let description=prompt('Deskripsi:',x.description||'');if(description===null)return;let cat=prompt('ID kategori (kosong jika tanpa kategori):',x.category_id||'');let {error}=await sb.from('agk_products').update({name:name.trim(),price:Number(price),description,category_id:cat||null}).eq('id',id);alert(error?error.message:'Menu diperbarui.');if(!error)show('menu')}
async function delProduct(id){if(!confirm('Hapus menu ini?'))return;let {error}=await sb.from('agk_products').delete().eq('id',id);alert(error?error.message:'Menu dihapus.');if(!error)show('menu')}
function reports(c){if(profile.role!=='owner'){c.innerHTML='<div class="card">Laporan khusus pemilik.</div>';return}c.innerHTML=`<div class="card"><h2>Laporan</h2><div class="row"><div><label>Dari tanggal</label><input type="date" id="from"></div><div><label>Sampai tanggal</label><input type="date" id="to"></div></div><button onclick="filterReport()">Tampilkan</button> <button class="secondary" onclick="show('laporan')">Reset</button><div id="reportOut"></div></div>`;filterReport()}
function filterReport(){let from=document.getElementById('from')?.value,to=document.getElementById('to')?.value;let filtered=tx.filter(x=>{let d=new Date(x.created_at).toISOString().slice(0,10);return(!from||d>=from)&&(!to||d<=to)});let sale=filtered.filter(x=>['sale','penjualan'].includes(x.transaction_type)).reduce((a,x)=>a+Number(x.amount||0),0),exp=filtered.filter(x=>['expense','pengeluaran'].includes(x.transaction_type)).reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('reportOut').innerHTML=`<div class="grid" style="margin-top:15px"><div class="card"><div class="muted">Penjualan</div><div class="stat">${money(sale)}</div></div><div class="card"><div class="muted">Pengeluaran</div><div class="stat">${money(exp)}</div></div><div class="card"><div class="muted">Selisih</div><div class="stat">${money(sale-exp)}</div></div></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Jumlah</th><th>Keterangan</th></tr></thead><tbody>${filtered.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('id-ID'))}</td><td>${esc(x.transaction_type)}</td><td>${money(x.amount)}</td><td>${esc(x.description||'')}</td></tr>`).join('')}</tbody></table></div>`}
sb.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;sb.from('agk_profiles').select('*').eq('id',user.id).maybeSingle().then(({data:p})=>{if(p){profile=p;initApp()}})}})
</script>
</body></html>
